apiVersion: v1
kind: ConfigMap
metadata:
  name: analize-config
  namespace: analize
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  ANALYSIS_DEFAULT_SYMBOLS: "BTCUSDT,ETHUSDT"
  ANALYSIS_TIMEFRAMES: "1m,5m,15m,1h,4h"
  SCHEDULER_DAILY_ANALYSIS_CRON: "0 1 * * *"
  SCHEDULER_WEEKLY_ANALYSIS_CRON: "0 2 * * 0"

---
apiVersion: v1
kind: Secret
metadata:
  name: analize-secrets
  namespace: analize
type: Opaque
stringData:
  database-url: "postgresql://analize:CHANGE_ME@postgres:5432/analize"
  redis-url: "redis://redis:6379/0"
  telegram-bot-token: ""
  slack-webhook-url: ""
