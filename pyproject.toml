[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analize"
version = "0.1.0"
description = "Cloud AI Analyzer for ScalperBot - Market analysis, ML-ready datasets, and parameter optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Analize Team"}
]
keywords = ["trading", "analysis", "ml", "scalperbot", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",

    # Data processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "polars>=0.19.0",

    # Technical analysis (optional - install separately if needed)
    # "ta>=0.11.0",

    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",

    # Background jobs
    "celery>=5.3.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",

    # Cloud storage
    "boto3>=1.33.0",
    "aioboto3>=12.0.0",

    # Monitoring
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",

    # Optimization & Statistics
    "optuna>=3.4.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",

    # Notifications
    "slack-sdk>=3.23.0",
    "python-telegram-bot>=20.6",

    # Utils
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "orjson>=3.9.0",
    "tenacity>=8.2.0",

    # WebSocket
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.92.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "pre-commit>=3.6.0",
]
ml = [
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "shap>=0.43.0",
]

[project.scripts]
analize = "analize.cli:main"

[project.urls]
Homepage = "https://github.com/armcoincrypto/Analize-"
Documentation = "https://github.com/armcoincrypto/Analize-#readme"
Repository = "https://github.com/armcoincrypto/Analize-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analize = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["analize"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --cov=analize --cov-report=term-missing"

[tool.coverage.run]
source = ["src/analize"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
