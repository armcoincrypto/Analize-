# Strategy Registry
# =================
# Central registry for all strategy configurations.
# Each strategy is versioned and tracked with metadata.
#
# Schema:
#   - strategy_id: unique identifier (e.g., "xrp_momentum_v1")
#   - symbol: trading pair
#   - status: active | champion | challenger | retired | testing
#   - regimes_allowed: list of market regimes where strategy operates
#   - causes: enabled/disabled cause signals
#   - params: tp/sl/tstop parameters
#   - execution: taker/maker/auto policy with thresholds
#   - risk: position sizing and loss limits
#   - metadata: versioning and validation info

version: "1.0"
updated_at: "2026-01-27T00:00:00Z"

# =============================================================================
# STRATEGIES
# =============================================================================

strategies:

  # ---------------------------------------------------------------------------
  # XRP Momentum Strategy v1 (CHAMPION)
  # ---------------------------------------------------------------------------
  xrp_momentum_v1:
    symbol: XRPUSDT
    status: champion
    description: "XRP momentum strategy with CVD and OB imbalance signals"

    # Market regimes where this strategy is allowed to trade
    # NOTE: low_vol_chop allowed for paper mode data collection
    regimes_allowed:
      - high_vol_trend
      - mean_reversion
      - low_vol_chop  # Allowed for paper probe mode
    regimes_blocked:
      - liquidity_vacuum
      - news_spike

    # Cause signal configuration
    causes:
      enabled:
        - ob_bullish_imbalance
        - ob_bearish_imbalance
        - cvd_buy_pressure
        - cvd_sell_pressure
        - price_momentum_up
        - price_momentum_down
      disabled:
        - btc_bullish
        - btc_bearish
      # Cause class policy: FULL (1.0x), PROBE (0.10x), BLOCK (0x)
      probe_causes:
        - unknown
      block_causes: []

    # Strategy parameters (relaxed for paper mode data collection)
    params:
      take_profit_pct: 0.20
      stop_loss_pct: 0.15
      time_stop_seconds: 90
      min_conditions: 2  # Relaxed for data collection (was 3)
      min_imbalance: 0.55  # Relaxed for data collection (was 0.60)
      min_confidence: 0.5  # Relaxed for data collection (was 0.6)

    # Execution policy
    execution:
      mode: maker  # Use maker for telemetry testing
      auto_maker_spread_threshold_bps: 2.0  # Use maker if spread <= 2 bps
      max_spread_bps: 5.0  # Block trades if spread > 5 bps
      maker_timeout_ms: 5000  # Cancel maker order after 5s
      maker_price_offset_bps: 0.5  # Place limit 0.5 bps inside spread

    # Risk limits
    risk:
      position_size_pct: 1.0  # 1% of capital per trade
      max_positions: 1  # Max concurrent positions
      max_daily_trades: 50
      max_daily_loss_pct: 2.0  # Stop trading after 2% daily loss
      max_drawdown_pct: 5.0  # Hard stop at 5% drawdown
      loss_streak_pause_trades: 5  # Pause after 5 consecutive losses
      loss_streak_pause_minutes: 30

    # Validation metadata
    metadata:
      created_at: "2026-01-20T10:00:00Z"
      updated_at: "2026-01-27T00:00:00Z"
      commit_hash: "71fc010"
      walkforward_run_id: "wf_xrp_20260125_143022"
      final_test_pnl_pct: 0.85
      final_test_sharpe: 0.62
      final_test_win_rate: 48.5
      final_test_trades: 127
      stress_test_passed: true
      stress_test_date: "2026-01-25"
      promotion_approved: true
      promotion_date: "2026-01-26"
      notes: "Passed all stress tests. Ready for live with 0.5% position size."

